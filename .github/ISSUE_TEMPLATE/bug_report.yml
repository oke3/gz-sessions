name: Bug report
description: Something doesn't work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Expected vs actual behavior. Include the exact command you ran.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `sessions --help` header, or the npm/bunx version used.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node 18
        - Node 20
        - Node 22
        - Bun
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - macOS
        - Windows (WSL)
        - Windows
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Redacted JSONL content, `GZ_SESSIONS_HOME` value, anything else relevant.
