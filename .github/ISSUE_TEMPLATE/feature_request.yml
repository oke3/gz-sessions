name: Feature request
description: Propose an improvement — check the Roadmap first
labels: ["enhancement"]
body:
  - type: checkboxes
    id: philosophy
    attributes:
      label: Philosophy check
      description: This project is local-first, zero-runtime-dependency, and grep-scale. Does your idea fit?
      options:
        - label: My idea keeps the project local-first and dependency-free
          required: true
        - label: I checked the [Roadmap](https://github.com/oke3/gz-sessions#roadmap) and this isn't already listed
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? Include the commands you wish existed.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or format changes.
